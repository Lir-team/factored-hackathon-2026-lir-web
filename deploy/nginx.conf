server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Written at start-up from the environment (40-lir-config.sh): never cached.
    location = /js/config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Local-only overrides; answered empty in production instead of a 404 per visit.
    location = /js/config.local.js {
        include /etc/nginx/security-headers.conf;
        default_type application/javascript;
        return 200 "";
    }

    # File names are not versioned: revalidate with the ETag on every load.
    location ~* \.(css|js|svg|png|gif|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
