server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional local override is never deployed; answer with an empty script instead of a 404.
    location = /js/config.local.js {
        default_type application/javascript;
        return 200 "";
    }
}
